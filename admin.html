<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Кто как проходил</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Рабочая таблица: сводка сверху, вопросы, затем участники с раскрывающимися ответами */
:root{
  --bg:#EAF2FB; --card:#FFFFFF; --ink:#1E2A3A; --muted:#5F6E84; --line:#D3DFEE;
  --a:#FF7A6B; --a-soft:#FFE3DE; --b:#4F8DF7; --b-soft:#DCE8FF; --lemon:#FFD95A; --lemon-ink:#5A4300;
  --display:"Unbounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121925; --card:#1B2433; --ink:#EEF3FA; --muted:#9DABC0; --line:#2B3749;
  --a:#FF8C7E; --a-soft:#45282A; --b:#6EA1FF; --b-soft:#1F3150; --lemon:#FFD95A; --lemon-ink:#3A2C00; color-scheme:dark;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 22px var(--display);margin:0}
h2{font:800 12px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
.card{background:var(--card);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile b{display:block;font:700 28px var(--display);font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:800;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.person{cursor:pointer}
tr.person:hover td{background:var(--bg)}
tr.person:focus-visible{outline:3px solid var(--lemon);outline-offset:-3px}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;min-width:120px;background:var(--line)}
.split i{background:var(--a)} .split u{background:var(--b)}
.opt-a{color:var(--a)} .opt-b{color:var(--b)}
.small{font-size:12px;color:var(--muted)}
.detail td{background:var(--bg)}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 16px;font-size:14px}
.gate{max-width:360px;margin:15vh auto 0}
input{font:600 16px var(--body);padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
button{font:700 15px var(--display);border:0;border-radius:999px;padding:12px 20px;background:var(--ink);color:var(--bg);cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
.err{color:var(--a);font-size:14px;margin:0;min-height:1.2em}
</style>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="common.js"></script>
</head>
<body>
<form class="card gate" id="gate">
  <h1>Админка</h1>
  <label for="pw" class="small">Пароль</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button type="submit">Войти</button>
  <p class="err" id="err"></p>
</form>

<div class="wrap" id="app" hidden>
  <div class="top">
    <h1>Кто как проходил</h1>
    <span class="status" id="status">Подключаемся…</span>
  </div>
  <div class="tiles">
    <div class="card tile"><b id="tPeople">0</b><span>участников</span></div>
    <div class="card tile"><b id="tAnswers">0</b><span>ответов всего</span></div>
    <div class="card tile"><b id="tAvg">0</b><span>вопросов в среднем на человека</span></div>
    <div class="card tile"><b id="tMax">0</b><span>рекорд выносливости</span></div>
  </div>
  <section class="card">
    <h2>Участники</h2>
    <p class="small">Каждая строка — один браузер. Нажми на строку, чтобы увидеть все ответы.</p>
    <div class="scroll"><table>
      <thead><tr><th>Кто</th><th>Тип</th><th>Ответов</th><th>Совпадение</th><th>Устройство</th><th>Впервые</th><th>Последний ответ</th></tr></thead>
      <tbody id="people"></tbody>
    </table></div>
  </section>
  <section class="card">
    <h2>Вопросы</h2>
    <div class="scroll"><table>
      <thead><tr><th>Вопрос</th><th>Ответили</th><th>Расклад</th></tr></thead>
      <tbody id="questions"></tbody>
    </table></div>
  </section>
</div>

<script>
// Пароль не хранится в коде, только его SHA-256
const PASS_HASH = "253230cd211eaa181f5e3c409ad4344d3e9449e4e121d049a6c455f3fd1e9a26";
const $ = id => document.getElementById(id);
const people = new Map();   // id -> {a, n, t, f, d}
const open = new Set();
let timer = null;

async function sha(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, "0")).join("");
}
async function tryLogin(pw){
  if(!pw || await sha("psy-match:" + pw) !== PASS_HASH) return false;
  try{ sessionStorage.setItem("sq-admin", pw); }catch(e){}
  $("gate").hidden = true; $("app").hidden = false;
  start();
  return true;
}
$("gate").addEventListener("submit", async e => {
  e.preventDefault();
  if(!await tryLogin($("pw").value)) $("err").textContent = "Неверный пароль";
});
try{ const saved = sessionStorage.getItem("sq-admin"); if(saved) tryLogin(saved); }catch(e){}

function loadQuestions(){
  fetch("questions.json", {cache: "no-cache"}).then(r => r.ok ? r.json() : []).then(list => {
    if(!Array.isArray(list)) return;
    for(const v of list)
      if(v && typeof v.id === "string" && /^[a-z0-9]{1,12}$/.test(v.id) && v.a && v.b && v.ax in AX && !qmap.has(v.id))
        qmap.set(v.id, {id: v.id, ax: v.ax, e: v.e || "❓", a: String(v.a), b: String(v.b)});
    schedule();
  }).catch(() => {});
}

function start(){
  loadQuestions();
  if(!window.mqtt){ $("status").textContent = "Не загрузилась библиотека связи, обнови страницу"; return; }
  const nets = [];
  for(const url of BROKERS){
    let c;
    try{ c = mqtt.connect(url, {clientId: "sqa" + Math.random().toString(36).slice(2, 12), clean: true, connectTimeout: 8000, reconnectPeriod: 4000, keepalive: 30}); }
    catch(e){ continue; }
    nets.push(c);
    const upd = () => { const k = nets.filter(n => n.connected).length; $("status").textContent = k ? "На связи, данные обновляются сами" : "Нет связи с сервером"; };
    c.on("connect", () => { c.subscribe(TOPIC + "/a/+", {qos: 0}); upd(); });
    c.on("close", upd);
    c.on("error", () => {});
    c.on("message", (topic, payload) => {
      const id = topic.slice(TOPIC.length + 3);
      if(!/^[a-z0-9]{10,24}$/.test(id)) return;
      const v = clean(payload.toString());
      if(!v) return;
      const old = people.get(id);
      if(old && old.t >= v.t) return;
      people.set(id, v); schedule();
    });
  }
}
function schedule(){ clearTimeout(timer); timer = setTimeout(render, 250); }

const fmt = ts => ts ? new Date(ts).toLocaleString("ru-RU", {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"}) : "—";
function cell(tr, text, cls){ const td = document.createElement("td"); td.textContent = text; if(cls) td.className = cls; tr.append(td); return td; }

function render(){
  const list = [...people.entries()].map(([id, v]) => ({id, ...v, n: Object.keys(v.a).filter(q => qmap.has(q)).length})).filter(p => p.n > 0);
  // расклад по каждому вопросу
  const split = new Map();
  for(const p of list) for(const q in p.a){ const s = split.get(q) || [0, 0]; s[p.a[q]]++; split.set(q, s); }

  const total = list.reduce((x, p) => x + p.n, 0);
  $("tPeople").textContent = list.length;
  $("tAnswers").textContent = total;
  $("tAvg").textContent = list.length ? Math.round(total / list.length) : 0;
  $("tMax").textContent = list.reduce((x, p) => Math.max(x, p.n), 0);

  list.sort((x, y) => y.t - x.t);
  const tb = $("people"); tb.textContent = "";
  if(!list.length){ const tr = document.createElement("tr"); cell(tr, "Пока никто не отвечал").colSpan = 7; tb.append(tr); }
  for(const p of list){
    // совпадение с остальными: средняя доля других, ответивших так же
    let sum = 0, k = 0;
    for(const q in p.a){ const s = split.get(q); if(!s) continue; const others = s[0] + s[1] - 1; if(others > 0){ sum += (s[p.a[q]] - 1) / others; k++; } }
    const t = archetype(axisScores(p.a));
    const tr = document.createElement("tr"); tr.className = "person"; tr.tabIndex = 0;
    cell(tr, "#" + p.id.slice(0, 6));
    cell(tr, t.emoji + " " + t.name);
    cell(tr, String(p.n));
    cell(tr, k ? Math.round(100 * sum / k) + "%" : "—");
    cell(tr, p.d || "—");
    cell(tr, fmt(p.f), "small");
    cell(tr, fmt(p.t), "small");
    const toggle = () => { open.has(p.id) ? open.delete(p.id) : open.add(p.id); render(); };
    tr.onclick = toggle;
    tr.onkeydown = e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggle(); } };
    tb.append(tr);
    if(open.has(p.id)){
      const dr = document.createElement("tr"); dr.className = "detail";
      const td = cell(dr, ""); td.colSpan = 7;
      const box = document.createElement("div"); box.className = "answers";
      for(const id of qmap.keys()){
        if(!(id in p.a)) continue;
        const q = qmap.get(id), pick = p.a[id];
        const row = document.createElement("div");
        const b = document.createElement("b"); b.className = pick === 0 ? "opt-a" : "opt-b"; b.textContent = pick === 0 ? q.a : q.b;
        row.append(q.e + " ", b, document.createElement("br"));
        const alt = document.createElement("span"); alt.className = "small"; alt.textContent = "а не «" + (pick === 0 ? q.b : q.a) + "»";
        row.append(alt);
        box.append(row);
      }
      td.append(box); tb.append(dr);
    }
  }

  const qb = $("questions"); qb.textContent = "";
  for(const q of qmap.values()){
    const s = split.get(q.id) || [0, 0], n = s[0] + s[1];
    const tr = document.createElement("tr");
    const td = cell(tr, "");
    const a = document.createElement("span"); a.className = "opt-a"; a.textContent = q.a;
    const b = document.createElement("span"); b.className = "opt-b"; b.textContent = q.b;
    td.append(q.e + " ", a, " или ", b);
    cell(tr, String(n));
    const sp = cell(tr, "");
    if(n){
      const bar = document.createElement("div"); bar.className = "split";
      const i = document.createElement("i"); i.style.width = (100 * s[0] / n) + "%";
      const u = document.createElement("u"); u.style.width = (100 * s[1] / n) + "%";
      bar.append(i, u);
      const lab = document.createElement("div"); lab.className = "small"; lab.textContent = Math.round(100 * s[0] / n) + "% / " + Math.round(100 * s[1] / n) + "%";
      sp.append(bar, lab);
    } else sp.textContent = "—";
    qb.append(tr);
  }
}
</script>
</body>
</html>
